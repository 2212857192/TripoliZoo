name: tripolizoo
description: "Tripoli Zoo - Official Mobile App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  go_router: ^14.6.2
  url_launcher: ^6.3.0
  mobile_scanner: ^7.2.0
  permission_handler: ^11.3.0
  qr_flutter: ^4.1.0
  google_fonts: ^6.2.1
  panorama_viewer: ^2.0.7
  http: ^1.6.0
  shared_preferences: ^2.5.5
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^19.0.0
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  geolocator: ^13.0.4
  video_player: ^2.10.1

dependency_overrides:
  # Keeps panorama texture sampling inside the final pixel to prevent a
  # visible seam where the 360-degree image wraps.
  flutter_cube:
    path: packages/flutter_cube

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_logo.jpg
  adaptive_icon_background: "#1B5E20"
  adaptive_icon_foreground: assets/images/app_logo.jpg

flutter:
  uses-material-design: true

  assets:
    - assets/config/api_host.txt
    - assets/fonts/
    - assets/images/background.jpg
    - assets/images/main.PNG
    - assets/images/map_nav_icon.png
    - assets/images/map.PNG
    - assets/images/app_logo.jpg
    - assets/images/شعار.jpg
    - assets/images/image1.png
    - assets/images/image2.png
    - assets/images/Hello.jpg
    - assets/images/Hello2.jpg
    - assets/images/bear.jpg
    - assets/images/lion.jpg
    - assets/images/tiger.jpg
    - assets/images/flamengo.jpg
    - assets/images/panorama/
    - assets/images/panorama/marked/
    - assets/images/panorama/12.JPG
    - assets/images/panorama/13.JPG
    - assets/images/panorama/14.JPG
    - assets/images/panorama/15.JPG
    - assets/images/panorama/16.JPG
    - assets/images/panorama/17.JPG
    - assets/images/panorama/18.JPG
    - assets/images/panorama/19.JPG
    - assets/images/panorama/20.JPG
    - assets/images/panorama/21.JPG
    - assets/images/panorama/22.JPG
    - assets/images/panorama/23.JPG
    - assets/images/panorama/24.JPG
    - assets/images/panorama/25.JPG
    - assets/images/panorama/26.JPG
    - assets/images/panorama/27.JPG
    - assets/images/panorama/28.JPG
    - assets/images/panorama/29.JPG
    - assets/images/panorama/30.JPG
    - assets/welcome.MP4
